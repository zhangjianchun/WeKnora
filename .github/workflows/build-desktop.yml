name: Build WeKnora Desktop (Windows only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: false
        default: "test-build"

concurrency:
  group: build-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-desktop-app:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Normalize line endings (modules.tsv)
        shell: bash
        run: sed -i 's/\r$//' licenses/sources/modules.tsv

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Configure Go environment
        shell: bash
        run: |
          go env -w GOPROXY="https://goproxy.cn,https://goproxy.io,https://mirrors.aliyun.com/goproxy/,direct"
          go env -w GOTOOLCHAIN=local
          go env -w GOSUMDB=sum.golang.google.cn
          go env -w GOFLAGS=-mod=mod
          echo "GODEBUG=http2client=0" >> "$GITHUB_ENV"

      - name: Clean Go module cache
        shell: bash
        run: go clean -modcache

      - name: Download & verify modules
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              echo "modules downloaded successfully"
              exit 0
            fi
            echo "go mod download failed, retrying ($i/5)..."
            sleep 15
          done
          echo "go mod download failed after 5 attempts"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-pkg-config

      - name: Set Windows CGO environment
        shell: bash
        run: |
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
          echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          # ★ 关键改动：静态链接 MinGW 运行时，让 exe 自包含，不依赖外部 DLL
          echo 'CGO_LDFLAGS=-static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic' >> $GITHUB_ENV

      - name: Download sqlite3.h and place for CGO
        shell: bash
        run: |
          echo "=== Locating sqlite-vec cgo directory ==="
          GOPATH=$(go env GOPATH)
          echo "GOPATH: $GOPATH"
          VEC_H=$(find "$GOPATH/pkg/mod/github.com/asg017" -name "sqlite-vec.h" 2>/dev/null | head -1)
          if [ -z "$VEC_H" ]; then
            echo "ERROR: sqlite-vec.h not found"
            find "$GOPATH/pkg/mod/github.com" -maxdepth 2 -name "*sqlite-vec*" 2>/dev/null
            exit 1
          fi
          VEC_CGO=$(dirname "$VEC_H")
          echo "Found sqlite-vec cgo dir at: $VEC_CGO"

          echo "=== Downloading sqlite amalgamation ==="
          mkdir -p /tmp/sqlite
          cd /tmp/sqlite
          curl -kL -o sqlite.zip https://www.sqlite.org/2025/sqlite-amalgamation-3500300.zip
          ls -la sqlite.zip
          unzip -o sqlite.zip
          SQLITE3_H=$(find /tmp/sqlite -name "sqlite3.h" | head -1)
          if [ -z "$SQLITE3_H" ]; then
            echo "ERROR: sqlite3.h not found after unzip"
            find /tmp/sqlite -type f
            exit 1
          fi
          echo "Found sqlite3.h at: $SQLITE3_H"

          echo "=== Copying into cgo dir ==="
          cp "$SQLITE3_H" "$VEC_CGO/sqlite3.h"
          ls -la "$VEC_CGO/"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pre-compile Go packages
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/msys64/mingw64/include"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      # ★ 去掉 -nsis，只生成裸 exe
      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/msys64/mingw64/include"

          bash ./scripts/check-license-bundle.sh || true
          cd cmd/desktop
          wails build -clean \
            -tags "sqlite_fts5" \
            -platform "windows/amd64" \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      # ★ 打包为 zip，包含 exe + config + web + migrations
      - name: Package Windows app (zip)
        shell: bash
        run: |
          set -x
          ARCHIVE="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_windows_amd64"
          BIN_DIR="cmd/desktop/build/bin"
          mkdir -p "${ARCHIVE}"

          echo "=== Listing build output ==="
          ls -la "$BIN_DIR" || true

          # 定位 exe（wails 在 Windows 下可能输出带或不带 .exe 后缀）
          EXE=$(find "$BIN_DIR" -maxdepth 1 -iname "*.exe" ! -iname "*installer*" | head -1)
          if [ -z "$EXE" ]; then
            CAND=$(find "$BIN_DIR" -maxdepth 1 -type f ! -iname "*.exe" | head -1)
            if [ -n "$CAND" ]; then
              cp "$CAND" "${CAND}.exe"
              EXE="${CAND}.exe"
            fi
          fi
          if [ -z "$EXE" ]; then
            echo "ERROR: no exe found"
            find "$BIN_DIR" -type f || true
            exit 1
          fi
          echo "Found exe: $EXE"
          cp "$EXE" "${ARCHIVE}/WeKnora Lite.exe"

          # 复制外部资源目录
          [ -d config ] && cp -r config "${ARCHIVE}/"
          if [ -d migrations/sqlite ]; then
            mkdir -p "${ARCHIVE}/migrations/sqlite"
            cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          fi
          [ -d frontend/dist ] && cp -r frontend/dist "${ARCHIVE}/web"
          [ -f .env.lite.example ] && cp .env.lite.example "${ARCHIVE}/.env"
          [ -f docs/LITE.md ] && cp docs/LITE.md "${ARCHIVE}/README.md"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}" 2>/dev/null || true

          # 打包 zip
          cd "${ARCHIVE}"
          7z a "../${ARCHIVE}.zip" . > /dev/null
          cd ..
          sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"

          echo "=== Final contents ==="
          ls -la "${ARCHIVE}/"
          ls -la "${ARCHIVE}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            WeKnora-Lite-App_*.zip
            WeKnora-Lite-App_*.zip.sha256
          retention-days: 3