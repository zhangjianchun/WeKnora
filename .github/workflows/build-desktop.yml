name: Build WeKnora Desktop (Windows only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: false
        default: "test-build"

concurrency:
  group: build-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-desktop-app:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      # Git for Windows 默认按 CRLF 检出文本文件，modules.tsv 的校验和列会带上 \r，
      # 导致 check-license-bundle.sh 报 "Invalid source checksum"
      - name: Normalize line endings (modules.tsv)
        shell: bash
        run: sed -i 's/\r$//' licenses/sources/modules.tsv

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # ---- Go 环境：多镜像回退，sumdb 走国内镜像，保留校验 ----
      - name: Configure Go environment
        shell: bash
        run: |
          go env -w GOPROXY="https://goproxy.cn,https://goproxy.io,https://mirrors.aliyun.com/goproxy/,direct"
          go env -w GOTOOLCHAIN=local
          go env -w GOSUMDB=sum.golang.google.cn
          go env -w GOFLAGS=-mod=mod
          # 部分代理对 HTTP/2 长连接处理不稳定，回退到 HTTP/1.1
          echo "GODEBUG=http2client=0" >> "$GITHUB_ENV"

      - name: Clean Go module cache
        shell: bash
        run: go clean -modcache

      # 以仓库提交的 go.sum 为准做下载校验，多镜像回退 + 重试
      - name: Download & verify modules
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              echo "modules downloaded successfully"
              exit 0
            fi
            echo "go mod download failed, retrying ($i/5)..."
            sleep 15
          done
          echo "go mod download failed after 5 attempts"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ---- Windows: 安装 MSYS2 MinGW-w64 工具链 ----
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-sqlite3

      - name: Set Windows CGO environment
        shell: bash
        run: |
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
          echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-static -lwinpthread" >> $GITHUB_ENV

      - name: Install NSIS
        run: choco install nsis -y

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pre-compile Go packages
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/msys64/mingw64/include"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations -IC:/msys64/mingw64/include"

          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          wails build -clean \
            -tags "sqlite_fts5" \
            -platform "windows/amd64" \
            -nsis \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      - name: Package Windows app
        shell: bash
        run: |
          ARCHIVE="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_windows_amd64"
          INSTALLER="cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          test -f "$INSTALLER"
          cp "$INSTALLER" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            WeKnora-Lite-App_*
          retention-days: 3