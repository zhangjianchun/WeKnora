name: Build Branded Desktop (Windows)

# 手动触发：在 branding 分支打「AI知识库」桌面客户端（绿色版 exe + NSIS 安装包）。
# 复用官方 release-lite.yml 的 Windows 桌面构建配方（Go 1.26 + Wails + NSIS），
# 只在 CI runner 上临时改应用名，不改动仓库源码。

on:
  workflow_dispatch:

concurrency:
  group: build-desktop-branding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  APP_NAME: "AI知识库"
  EDITION: lite
  CGO_ENABLED: "1"

jobs:
  build-windows:
    name: Windows amd64 desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        # 钉死到 go.mod 使用的 v2.12.0，避免 @latest 漂移带来的版本不确定性
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Brand app name (runner-only, no repo changes)
        shell: bash
        run: |
          APP="${{ env.APP_NAME }}"
          for f in \
            cmd/desktop/main.go \
            cmd/desktop/main_bindings.go \
            cmd/desktop/prefs.go \
            cmd/desktop/signing_key.go \
            cmd/desktop/update.go \
            cmd/desktop/wails.json; do
            sed -i "s/WeKnora Lite/${APP}/g" "$f"
          done
          echo "--- wails.json name ---"
          grep '"name"' cmd/desktop/wails.json | head -1

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci --prefer-offline
          VITE_AppVersion="v$(tr -d '\n\r' < ../VERSION)" npm run build
          cd ..
          rm -rf web
          cp -r frontend/dist web
          grep -o '<title>[^<]*</title>' web/index.html

      # sqlite-vec-go-bindings 的 cgo 在 SQLITE_CORE 下 #include "sqlite3.h"，
      # 但模块缓存里只有 mattn/go-sqlite3 的 sqlite3-binding.h。复制一份改名，
      # 并把目录加入 CGO_CFLAGS 的 -I，否则编译报 sqlite3.h: No such file。
      - name: Prepare sqlite3.h for sqlite-vec cgo
        shell: bash
        run: |
          # 该模块是 indirect 依赖，可能尚未下载，先显式拉取，否则 go list -m 的 .Dir 为空
          go mod download github.com/mattn/go-sqlite3
          SQLITE_DIR="$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)"
          echo "SQLITE_DIR=$SQLITE_DIR"
          test -f "$SQLITE_DIR/sqlite3-binding.h"
          INC="$RUNNER_TEMP/weknora-cgo-include"
          mkdir -p "$INC"
          cp "$SQLITE_DIR/sqlite3-binding.h" "$INC/sqlite3.h"
          cp "$SQLITE_DIR/sqlite3ext.h" "$INC/" 2>/dev/null || true
          # Windows 下 gcc 需要盘符绝对路径；反斜杠转正斜杠
          INC_WIN="$(echo "$INC" | sed 's#\\#/#g')"
          echo "CGO_CFLAGS=-Wno-deprecated-declarations -I$INC_WIN" >> "$GITHUB_ENV"
          echo "sqlite3.h prepared at $INC"

      - name: Pre-compile Go packages (warm cache)
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app (Wails + NSIS)
        shell: bash
        run: |
          export EDITION="${{ env.EDITION }}"
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          # -skipbindings: go.mod 升到 Go1.26 后，Wails v2.12 绑定生成器的 go/packages
          #   类型加载会触发 sqlite3.h 缺失 / "package without types" 错误；绑定文件
          #   (frontend/src/wailsjs) 已在仓库中，前端也已独立构建，故跳过。
          # -s: 跳过 Wails 内部前端重建（前面 Build frontend 已完成）
          # -m: 跳过 mod tidy（依赖已在 go.mod/go.sum，pre-compile 已验证可编译）
          wails build -clean \
            -skipbindings \
            -s \
            -m \
            -tags "sqlite_fts5" \
            -platform windows/amd64 \
            -nsis \
            -ldflags="${LDFLAGS}" \
            -o "${{ env.APP_NAME }}"

      - name: Assemble artifacts
        shell: bash
        run: |
          APP="${{ env.APP_NAME }}"
          VER="$(tr -d '\n\r' < VERSION)"
          BIN="cmd/desktop/build/bin"

          echo "--- built files ---"
          ls -la "$BIN"

          # 绿色版目录：exe + 资源（config/.env/migrations/web/licenses/dict）
          GREEN="${APP}_${VER}_windows_amd64_portable"
          mkdir -p "$GREEN/config" "$GREEN/migrations/sqlite" "$GREEN/dict"
          # wails -o 在 Windows 产出的文件名可能是 "AI知识库"、"AI知识库.exe"、
          # "AI知识库-amd64.exe" 之一（本次实测为无后缀的 "AI知识库"）。统一复制并重命名为 .exe。
          EXE_SRC=""
          for cand in "$BIN/${APP}.exe" "$BIN/${APP}-amd64.exe" "$BIN/${APP}"; do
            if [ -f "$cand" ]; then EXE_SRC="$cand"; break; fi
          done
          test -n "$EXE_SRC" || { echo "desktop exe not found in $BIN" >&2; exit 1; }
          cp "$EXE_SRC" "$GREEN/${APP}.exe"
          echo "exe source: $EXE_SRC -> $GREEN/${APP}.exe"
          cp .env.lite.example "$GREEN/.env"
          # 桌面端"无需注册"：禁止自助注册（auto-setup 会自动创建默认用户并登录，
          # 即使自动登录因故失败落到登录页，也不显示注册入口）
          sed -i 's/^DISABLE_REGISTRATION=.*/DISABLE_REGISTRATION=true/' "$GREEN/.env"
          cp -r config/* "$GREEN/config/"
          cp -r migrations/sqlite/* "$GREEN/migrations/sqlite/"
          cp -r web "$GREEN/web"
          # jieba 词典：newJieba() 会优先读 exe 同目录的 dict/，避免 gojieba
          # 编译期固化的构建机源码路径在用户机器上不存在导致启动 panic
          JIEBA_DIR="$(go list -m -f '{{.Dir}}' github.com/yanyiwu/gojieba)/deps/cppjieba/dict"
          test -f "$JIEBA_DIR/jieba.dict.utf8" || { echo "jieba dict not found at $JIEBA_DIR" >&2; exit 1; }
          cp "$JIEBA_DIR"/*.utf8 "$GREEN/dict/"
          # README 品牌化：WeKnora Lite/WeKnora-lite 统一替换为 AI知识库
          if [ -f "$GREEN/README.md" ]; then
            sed -i 's/WeKnora Lite/AI知识库/g; s/WeKnora-lite/AI知识库/g; s/WeKnora/AI知识库/g' "$GREEN/README.md"
          fi
          bash ./scripts/copy-licenses.sh "$GREEN" 2>/dev/null || true
          (cd . && 7z a -tzip "${GREEN}.zip" "$GREEN" >/dev/null 2>&1 || powershell -Command "Compress-Archive -Path '$GREEN' -DestinationPath '${GREEN}.zip' -Force")
          sha256sum "${GREEN}.zip" > "${GREEN}.zip.sha256"

          # NSIS 安装包
          INSTALLER=$(find "$BIN" -iname "*-installer.exe" | head -1)
          if [ -n "$INSTALLER" ]; then
            SETUP="${APP}_${VER}_windows_amd64_setup.exe"
            cp "$INSTALLER" "$SETUP"
            sha256sum "$SETUP" > "$SETUP.sha256"
          fi

          echo "--- artifacts ---"
          ls -lh ./*.zip ./*.exe ./*.sha256 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: branding-desktop-windows-amd64
          path: |
            ./${{ env.APP_NAME }}_*.zip
            ./${{ env.APP_NAME }}_*.exe
            ./${{ env.APP_NAME }}_*.sha256
          retention-days: 7
